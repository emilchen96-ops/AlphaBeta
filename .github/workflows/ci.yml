name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: alphadesk_test
          POSTGRES_USER: alphadesk_test
          POSTGRES_PASSWORD: local-ci-placeholder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alphadesk_test -d alphadesk_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      ALPHADESK_ENVIRONMENT: test
      ALPHADESK_POSTGRES_HOST: localhost
      ALPHADESK_POSTGRES_DB: alphadesk_test
      ALPHADESK_POSTGRES_USER: alphadesk_test
      ALPHADESK_POSTGRES_PASSWORD: local-ci-placeholder
      ALPHADESK_REDIS_HOST: localhost
      ALPHADESK_RUN_INTEGRATION: "true"
      ALPHADESK_RUN_M02_INTEGRATION: "true"
      ALPHADESK_RUN_M03_INTEGRATION: "true"
      ALPHADESK_RUN_M04_INTEGRATION: "true"
      ALPHADESK_TEST_DATABASE_URL: postgresql+asyncpg://alphadesk_test:local-ci-placeholder@localhost:5432/alphadesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --requirement requirements.lock
          pip install --no-deps --editable .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: alembic upgrade head
      - run: alembic current
      - run: alembic check
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
