[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "alphadesk-api"
version = "0.1.0"
description = "AlphaDesk M01 infrastructure API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "akshare==1.18.64",
  "asyncpg>=0.30,<1",
  "baostock==0.9.3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "redis>=6,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "tzdata>=2026.3,<2027",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.26,<1",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "unit: isolated deterministic unit tests",
  "integration: requires explicitly configured external test services",
  "m04: simulated-account and accounting milestone tests",
  "m05: order fact pipeline milestone tests",
  "s01: strategy interface and historical-runner milestone tests",
  "r01: risk decision and order safety-gate milestone tests",
  "b01: simulated Broker execution and accounting milestone tests",
  "bt01: deterministic A-share daily backtesting milestone tests",
  "rt01: controllable historical daily replay milestone tests",
  "d03: offline intraday market-data center milestone tests",
  "sc01: deterministic historical market scanner milestone tests",
  "n01: information source and market-event center milestone tests",
  "a01: grounded AI research assistant milestone tests",
  "concurrency: requires real PostgreSQL locking",
  "accounting_regression: verifies order facts do not alter M04 ledgers",
  "external: requires explicit access to free external providers",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["B007", "D", "E501"]

[tool.ruff.format]
# Historical migrations are immutable; 0009 predates the formatter baseline.
exclude = [
  "alembic/versions/0009_r01_risk_decision_pipeline.py",
  "alembic/versions/0017_d02_market_reference_data.py",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["redis.*", "akshare", "baostock"]
ignore_missing_imports = true
