name: alphadesk

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alphadesk}
      POSTGRES_USER: ${POSTGRES_USER:-alphadesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  postgres_test:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: alphadesk_test
      POSTGRES_USER: alphadesk_test
      POSTGRES_PASSWORD: local-test-placeholder
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: "no"

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    environment:
      ALPHADESK_APP_NAME: alphadesk-api
      ALPHADESK_APP_VERSION: 0.1.0
      ALPHADESK_ENVIRONMENT: ${ALPHADESK_ENVIRONMENT:-development}
      ALPHADESK_DEBUG: ${ALPHADESK_DEBUG:-false}
      ALPHADESK_CORS_ORIGINS: ${ALPHADESK_CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
      ALPHADESK_POSTGRES_HOST: postgres
      ALPHADESK_POSTGRES_PORT: 5432
      ALPHADESK_POSTGRES_DB: ${POSTGRES_DB:-alphadesk}
      ALPHADESK_POSTGRES_USER: ${POSTGRES_USER:-alphadesk}
      ALPHADESK_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      ALPHADESK_TEST_DATABASE_URL: postgresql+asyncpg://alphadesk_test:local-test-placeholder@postgres_test:5432/alphadesk_test
      ALPHADESK_REDIS_HOST: redis
      ALPHADESK_REDIS_PORT: 6379
      ALPHADESK_LOG_LEVEL: ${ALPHADESK_LOG_LEVEL:-INFO}
      ALPHADESK_WEBSOCKET_HEARTBEAT_SECONDS: ${ALPHADESK_WEBSOCKET_HEARTBEAT_SECONDS:-20}
      ALPHADESK_CORRELATION_ID_HEADER: ${ALPHADESK_CORRELATION_ID_HEADER:-X-Correlation-ID}
      ALPHADESK_FREE_MARKET_DATA_ENABLED: ${ALPHADESK_FREE_MARKET_DATA_ENABLED:-false}
      ALPHADESK_HISTORICAL_MARKET_PROVIDER: ${ALPHADESK_HISTORICAL_MARKET_PROVIDER:-miniqmt}
      ALPHADESK_AUTHORITATIVE_MARKET_SOURCE: MINIQMT
      ALPHADESK_ALLOW_TEST_MARKET_DATA: ${ALPHADESK_ALLOW_TEST_MARKET_DATA:-false}
      ALPHADESK_MINIQMT_MARKET_DATA_ENABLED: ${ALPHADESK_MINIQMT_MARKET_DATA_ENABLED:-false}
      ALPHADESK_MINIQMT_DATA_PATH: ${ALPHADESK_MINIQMT_DATA_PATH:-}
      ALPHADESK_MINIQMT_AGENT_TOKEN: ${ALPHADESK_MINIQMT_AGENT_TOKEN:-}
      ALPHADESK_MINIQMT_MAX_SUBSCRIPTIONS: ${ALPHADESK_MINIQMT_MAX_SUBSCRIPTIONS:-200}
      ALPHADESK_MINIQMT_BENCHMARK_SYMBOLS: ${ALPHADESK_MINIQMT_BENCHMARK_SYMBOLS:-["510300.SSE","510500.SSE"]}
      ALPHADESK_MINIQMT_HISTORY_MAX_INSTRUMENTS: ${ALPHADESK_MINIQMT_HISTORY_MAX_INSTRUMENTS:-50}
      ALPHADESK_MINIQMT_HISTORY_MAX_DAYS: ${ALPHADESK_MINIQMT_HISTORY_MAX_DAYS:-3650}
      ALPHADESK_MINIQMT_QUOTE_TTL_SECONDS: ${ALPHADESK_MINIQMT_QUOTE_TTL_SECONDS:-300}
      ALPHADESK_AI_RESEARCH_PROVIDER: ${ALPHADESK_AI_RESEARCH_PROVIDER:-disabled}
      ALPHADESK_AI_BASE_URL: ${ALPHADESK_AI_BASE_URL:-}
      ALPHADESK_AI_API_KEY: ${ALPHADESK_AI_API_KEY:-}
      ALPHADESK_TUSHARE_ENABLED: ${TUSHARE_ENABLED:-false}
      ALPHADESK_TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      ALPHADESK_MARKET_CALENDAR_PROVIDER: ${MARKET_CALENDAR_PROVIDER:-verified}
      ALPHADESK_MARKET_ADJUSTMENT_PROVIDER: ${MARKET_ADJUSTMENT_PROVIDER:-fixture}
      ALPHADESK_MARKET_SUSPENSION_PROVIDER: ${MARKET_SUSPENSION_PROVIDER:-fixture}
      ALPHADESK_AI_MODEL: ${ALPHADESK_AI_MODEL:-}
      ALPHADESK_AI_REQUEST_TIMEOUT_SECONDS: ${ALPHADESK_AI_REQUEST_TIMEOUT_SECONDS:-30}
      ALPHADESK_AI_MAX_RETRIES: ${ALPHADESK_AI_MAX_RETRIES:-1}
      ALPHADESK_AI_MAX_INPUT_CHARACTERS: ${ALPHADESK_AI_MAX_INPUT_CHARACTERS:-50000}
      ALPHADESK_AI_MAX_OUTPUT_TOKENS: ${ALPHADESK_AI_MAX_OUTPUT_TOKENS:-2000}
      ALPHADESK_AI_TEMPERATURE: ${ALPHADESK_AI_TEMPERATURE:-0.1}
      ALPHADESK_AI_COST_INPUT_PER_MILLION: ${ALPHADESK_AI_COST_INPUT_PER_MILLION:-}
      ALPHADESK_AI_COST_OUTPUT_PER_MILLION: ${ALPHADESK_AI_COST_OUTPUT_PER_MILLION:-}
      ALPHADESK_AI_STRUCTURED_OUTPUT_ENABLED: ${ALPHADESK_AI_STRUCTURED_OUTPUT_ENABLED:-true}
      ALPHADESK_REPLAY_INTERVAL_X1_MS: ${ALPHADESK_REPLAY_INTERVAL_X1_MS:-1000}
      ALPHADESK_REPLAY_INTERVAL_X10_MS: ${ALPHADESK_REPLAY_INTERVAL_X10_MS:-250}
      ALPHADESK_REPLAY_INTERVAL_X100_MS: ${ALPHADESK_REPLAY_INTERVAL_X100_MS:-50}
      ALPHADESK_REPLAY_MAX_INSTRUMENTS: ${ALPHADESK_REPLAY_MAX_INSTRUMENTS:-20}
      ALPHADESK_REPLAY_MAX_SESSIONS: ${ALPHADESK_REPLAY_MAX_SESSIONS:-5000}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  market_worker:
    build:
      context: ./apps/api
    command: ["python", "-m", "alphadesk_api.workers.free_market_data"]
    environment:
      ALPHADESK_ENVIRONMENT: ${ALPHADESK_ENVIRONMENT:-development}
      ALPHADESK_POSTGRES_HOST: postgres
      ALPHADESK_POSTGRES_PORT: 5432
      ALPHADESK_POSTGRES_DB: ${POSTGRES_DB:-alphadesk}
      ALPHADESK_POSTGRES_USER: ${POSTGRES_USER:-alphadesk}
      ALPHADESK_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      ALPHADESK_REDIS_HOST: redis
      ALPHADESK_REDIS_PORT: 6379
      ALPHADESK_LOG_LEVEL: ${ALPHADESK_LOG_LEVEL:-INFO}
      ALPHADESK_FREE_MARKET_DATA_ENABLED: ${ALPHADESK_FREE_MARKET_DATA_ENABLED:-false}
      ALPHADESK_FREE_MARKET_POLL_SECONDS: ${ALPHADESK_FREE_MARKET_POLL_SECONDS:-30}
      ALPHADESK_FREE_MARKET_IDLE_POLL_SECONDS: ${ALPHADESK_FREE_MARKET_IDLE_POLL_SECONDS:-120}
      ALPHADESK_FREE_MARKET_CLOSED_POLL_SECONDS: ${ALPHADESK_FREE_MARKET_CLOSED_POLL_SECONDS:-600}
      ALPHADESK_FREE_MARKET_MINUTE_SYNC_SECONDS: ${ALPHADESK_FREE_MARKET_MINUTE_SYNC_SECONDS:-300}
      ALPHADESK_FREE_MARKET_MINUTE_MAX_SYMBOLS: ${ALPHADESK_FREE_MARKET_MINUTE_MAX_SYMBOLS:-20}
      ALPHADESK_FREE_MARKET_MINUTE_LOOKBACK_MINUTES: ${ALPHADESK_FREE_MARKET_MINUTE_LOOKBACK_MINUTES:-120}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,redis; x=redis.Redis(host=os.getenv('ALPHADESK_REDIS_HOST','redis'),decode_responses=True); assert x.get('alphadesk:market:v1:worker:heartbeat'); x.close()",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  replay_worker:
    build:
      context: ./apps/api
    command: ["python", "-m", "alphadesk_api.workers.replay"]
    environment:
      ALPHADESK_ENVIRONMENT: ${ALPHADESK_ENVIRONMENT:-development}
      ALPHADESK_POSTGRES_HOST: postgres
      ALPHADESK_POSTGRES_PORT: 5432
      ALPHADESK_POSTGRES_DB: ${POSTGRES_DB:-alphadesk}
      ALPHADESK_POSTGRES_USER: ${POSTGRES_USER:-alphadesk}
      ALPHADESK_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      ALPHADESK_REDIS_HOST: redis
      ALPHADESK_REDIS_PORT: 6379
      ALPHADESK_LOG_LEVEL: ${ALPHADESK_LOG_LEVEL:-INFO}
      ALPHADESK_REPLAY_INTERVAL_X1_MS: ${ALPHADESK_REPLAY_INTERVAL_X1_MS:-1000}
      ALPHADESK_REPLAY_INTERVAL_X10_MS: ${ALPHADESK_REPLAY_INTERVAL_X10_MS:-250}
      ALPHADESK_REPLAY_INTERVAL_X100_MS: ${ALPHADESK_REPLAY_INTERVAL_X100_MS:-50}
      ALPHADESK_REPLAY_WORKER_POLL_MS: ${ALPHADESK_REPLAY_WORKER_POLL_MS:-250}
      ALPHADESK_REPLAY_WORKER_LEASE_SECONDS: ${ALPHADESK_REPLAY_WORKER_LEASE_SECONDS:-15}
      ALPHADESK_REPLAY_WORKER_HEARTBEAT_SECONDS: ${ALPHADESK_REPLAY_WORKER_HEARTBEAT_SECONDS:-5}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,redis; x=redis.Redis(host=os.getenv('ALPHADESK_REDIS_HOST','redis'),decode_responses=True); assert x.get('alphadesk:replays:v1:worker:heartbeat'); x.close()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  scanner_worker:
    build:
      context: ./apps/api
    command: ["python", "-m", "alphadesk_api.workers.scanners"]
    environment:
      ALPHADESK_ENVIRONMENT: ${ALPHADESK_ENVIRONMENT:-development}
      ALPHADESK_POSTGRES_HOST: postgres
      ALPHADESK_POSTGRES_PORT: 5432
      ALPHADESK_POSTGRES_DB: ${POSTGRES_DB:-alphadesk}
      ALPHADESK_POSTGRES_USER: ${POSTGRES_USER:-alphadesk}
      ALPHADESK_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      ALPHADESK_REDIS_HOST: redis
      ALPHADESK_REDIS_PORT: 6379
      ALPHADESK_LOG_LEVEL: ${ALPHADESK_LOG_LEVEL:-INFO}
      ALPHADESK_SCANNER_WORKER_POLL_MS: ${ALPHADESK_SCANNER_WORKER_POLL_MS:-1000}
      ALPHADESK_SCANNER_WORKER_HEARTBEAT_SECONDS: ${ALPHADESK_SCANNER_WORKER_HEARTBEAT_SECONDS:-5}
      ALPHADESK_SCANNER_BACKFILL_BATCH_SIZE: ${ALPHADESK_SCANNER_BACKFILL_BATCH_SIZE:-50}
      ALPHADESK_SCANNER_BACKFILL_WAIT_SECONDS: ${ALPHADESK_SCANNER_BACKFILL_WAIT_SECONDS:-120}
      ALPHADESK_SCANNER_SCAN_BATCH_SIZE: ${ALPHADESK_SCANNER_SCAN_BATCH_SIZE:-250}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,redis; x=redis.Redis(host=os.getenv('ALPHADESK_REDIS_HOST','redis'),decode_responses=True); assert x.get('alphadesk:scanners:v1:worker:heartbeat'); x.close()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  backtest_batch_worker:
    build:
      context: ./apps/api
    command: ["python", "-m", "alphadesk_api.workers.backtest_batches"]
    environment:
      ALPHADESK_ENVIRONMENT: ${ALPHADESK_ENVIRONMENT:-development}
      ALPHADESK_POSTGRES_HOST: postgres
      ALPHADESK_POSTGRES_PORT: 5432
      ALPHADESK_POSTGRES_DB: ${POSTGRES_DB:-alphadesk}
      ALPHADESK_POSTGRES_USER: ${POSTGRES_USER:-alphadesk}
      ALPHADESK_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      ALPHADESK_REDIS_HOST: redis
      ALPHADESK_REDIS_PORT: 6379
      ALPHADESK_LOG_LEVEL: ${ALPHADESK_LOG_LEVEL:-INFO}
      ALPHADESK_BACKTEST_BATCH_WORKER_POLL_MS: ${ALPHADESK_BACKTEST_BATCH_WORKER_POLL_MS:-500}
      ALPHADESK_BACKTEST_BATCH_ITEM_STALE_SECONDS: ${ALPHADESK_BACKTEST_BATCH_ITEM_STALE_SECONDS:-1800}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,redis; x=redis.Redis(host=os.getenv('ALPHADESK_REDIS_HOST','redis'),decode_responses=True); assert x.get('alphadesk:backtest-batches:v1:worker:heartbeat'); x.close()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  ai_research_worker:
    build:
      context: ./apps/api
    command: ["python", "-m", "alphadesk_api.workers.ai_research"]
    environment:
      ALPHADESK_ENVIRONMENT: ${ALPHADESK_ENVIRONMENT:-development}
      ALPHADESK_POSTGRES_HOST: postgres
      ALPHADESK_POSTGRES_PORT: 5432
      ALPHADESK_POSTGRES_DB: ${POSTGRES_DB:-alphadesk}
      ALPHADESK_POSTGRES_USER: ${POSTGRES_USER:-alphadesk}
      ALPHADESK_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      ALPHADESK_REDIS_HOST: redis
      ALPHADESK_REDIS_PORT: 6379
      ALPHADESK_LOG_LEVEL: ${ALPHADESK_LOG_LEVEL:-INFO}
      ALPHADESK_AI_RESEARCH_PROVIDER: ${ALPHADESK_AI_RESEARCH_PROVIDER:-disabled}
      ALPHADESK_AI_BASE_URL: ${ALPHADESK_AI_BASE_URL:-}
      ALPHADESK_AI_API_KEY: ${ALPHADESK_AI_API_KEY:-}
      ALPHADESK_AI_MODEL: ${ALPHADESK_AI_MODEL:-}
      ALPHADESK_AI_REQUEST_TIMEOUT_SECONDS: ${ALPHADESK_AI_REQUEST_TIMEOUT_SECONDS:-30}
      ALPHADESK_AI_MAX_RETRIES: ${ALPHADESK_AI_MAX_RETRIES:-1}
      ALPHADESK_AI_MAX_INPUT_CHARACTERS: ${ALPHADESK_AI_MAX_INPUT_CHARACTERS:-50000}
      ALPHADESK_AI_MAX_OUTPUT_TOKENS: ${ALPHADESK_AI_MAX_OUTPUT_TOKENS:-2000}
      ALPHADESK_AI_TEMPERATURE: ${ALPHADESK_AI_TEMPERATURE:-0.1}
      ALPHADESK_AI_COST_INPUT_PER_MILLION: ${ALPHADESK_AI_COST_INPUT_PER_MILLION:-}
      ALPHADESK_AI_COST_OUTPUT_PER_MILLION: ${ALPHADESK_AI_COST_OUTPUT_PER_MILLION:-}
      ALPHADESK_AI_STRUCTURED_OUTPUT_ENABLED: ${ALPHADESK_AI_STRUCTURED_OUTPUT_ENABLED:-true}
      ALPHADESK_AI_RESEARCH_WORKER_POLL_MS: ${ALPHADESK_AI_RESEARCH_WORKER_POLL_MS:-1000}
      ALPHADESK_AI_RESEARCH_TASK_STALE_SECONDS: ${ALPHADESK_AI_RESEARCH_TASK_STALE_SECONDS:-300}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,redis; x=redis.Redis(host=os.getenv('ALPHADESK_REDIS_HOST','redis'),decode_responses=True); assert x.get('alphadesk:ai-research:v1:worker:heartbeat'); x.close()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:8000}
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5173/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
